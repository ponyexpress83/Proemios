<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Proemios — prima e dopo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { margin: 0; padding: 24px; background: #FAFAF7; color: #131936; font: 15px/1.5 system-ui, sans-serif; }
  h1 { font: 400 27px/1.2 Georgia, serif; margin: 0 0 4px; }
  p { color: #565B69; margin: 0 0 24px; }
  section { margin-bottom: 40px; }
  h2 { font: 400 21px/1.3 Georgia, serif; margin: 0 0 12px; }
  .coppia { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  figure { margin: 0; }
  figcaption { font-size: 13.5px; color: #565B69; margin-bottom: 6px; }
  img { width: 100%; height: auto; display: block; border: 1px solid #DEDFE3; background: #fff; }
  nav a { color: #24408E; margin-right: 16px; }
</style>
</head>
<body>
<h1>Prima e dopo</h1>
<p>Screenshot di pagina intera a 375 e 1 280 px, build di produzione, stessa procedura (<code>scripts/audit-design.mjs</code>). A sinistra il deploy del 7 ottobre 2026, a destra il redesign «matita rossa e blu».</p>
<nav id="indice"></nav>
<div id="pagine"></div>
<script>
  const PAGINE = ["home","preventivo","analisi-manoscritto","contatti","servizi","servizio","percorsi","percorso","come-funziona","per-agenzie","blog","casi-studio","chi-siamo","accedi","404"];
  const LARGHEZZE = [375, 1280];
  const indice = document.getElementById("indice"), cont = document.getElementById("pagine");
  for (const p of PAGINE) {
    const a = document.createElement("a"); a.href = "#" + p; a.textContent = p; indice.append(a);
    for (const w of LARGHEZZE) {
      const s = document.createElement("section"); s.id = w === LARGHEZZE[0] ? p : p + "-" + w;
      s.innerHTML = `<h2>${p} · ${w} px</h2><div class="coppia">
        <figure><figcaption>Prima</figcaption><img loading="lazy" src="before/${p}-${w}.png" alt="${p} a ${w} px, prima"></figure>
        <figure><figcaption>Dopo</figcaption><img loading="lazy" src="after/${p}-${w}.png" alt="${p} a ${w} px, dopo"></figure>
      </div>`;
      cont.append(s);
    }
  }
</script>
</body>
</html>
