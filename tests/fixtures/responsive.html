<!doctype html><html lang="it"><meta charset="utf-8"><title>Proemios — verifica responsive</title><style>body{margin:0;background:#dadade;font:14px system-ui}nav{height:60px;display:flex;align-items:center;gap:12px;padding:0 20px;position:relative;z-index:5}button,select{padding:9px;min-height:40px}iframe{display:block;border:0;width:390px;height:15000px;background:#fff;margin:0 auto;transform-origin:top left}main{overflow:visible}</style><nav><label>Larghezza <select id="width"><option>360</option><option selected>390</option><option>768</option><option>1280</option><option>1440</option></select></label><label>Versione <select id="version"><option value="after">Anteprima</option><option value="before">Produzione prima</option></select></label><label>Pagina <select id="route"><option value="/">Homepage</option><option value="/accedi">Accesso demo</option><option value="/area-autore">Area autore</option><option value="/preventivo">Preventivo</option></select></label><button id="refresh">Apri pagina</button></nav><main><iframe id="site" title="Sito da verificare" src="/"></iframe></main><script>const frame=document.querySelector('iframe');const widths=document.querySelector('#width');const versions=document.querySelector('#version');const routes=document.querySelector('#route');widths.onchange=()=>frame.style.width=widths.value+'px';document.querySelector('#refresh').onclick=()=>frame.src=(versions.value==='before'?'https://proemios.vercel.app':'')+routes.value;</script></html>
