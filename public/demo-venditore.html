const sum=items=>items.reduce((n,x)=>n+x.amount,0);
const initials=name=>name.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
function notify(message){clearTimeout(toastTimer);document.getElementById('toast').textContent=message;toastTimer=setTimeout(()=>document.getElementById('toast').textContent='',5000)}
function heading(title,sub,actions=''){return '<div class="page-heading"><div><p class="eyebrow">IL TUO SPAZIO COMMERCIALE</p><h1>'+title+'</h1><p class="subtitle">'+sub+'</p></div><div class="actions">'+actions+'</div></div>'}
function quoteButton(){return '<button class="btn" data-action="new-quote">'+icon('plus')+'Nuovo preventivo</button>'}
function metrics(){const won=leads.filter(x=>x.stage==='acquisito'),open=leads.filter(x=>x.stage!=='acquisito');const values=[['Opportunità aperte',open.length,'Progetti da accompagnare','users'],['Pipeline attiva',euro(sum(open)),'Valori indicativi dello scenario','trend'],['Vendite confermate',euro(sum(won)),'Accordi simulati nel periodo','book'],['Provvigioni stimate',euro(sum(won)*.15),'Ipotesi demo: 15% delle vendite','wallet']];return '<div class="stats">'+values.map(([name,value,foot,i])=>'<article class="stat"><div class="stat-top"><span>'+name+'</span><span class="stat-icon">'+icon(i)+'</span></div><div class="stat-value">'+value+'</div><p class="stat-foot">'+foot+'</p></article>').join('')+'</div>'}
function row(l){return '<div class="lead-row"><span class="initial '+esc(l.color)+'">'+esc(l.initial)+'</span><div class="lead-info"><strong>'+esc(l.name)+'</strong><small>'+esc(l.type)+' · '+esc(l.title)+'</small></div><div class="lead-amount">'+euro(l.amount)+'<div style="margin-top:5px">'+badge(l.stage)+'</div></div><button class="lead-open" data-action="detail" data-id="'+l.id+'" aria-label="Apri '+esc(l.name)+'">'+icon('arrow')+'</button></div>'}
function activityList(){return '<div class="activity-list">'+[['file','Preventivo demo preparato per Luca Moretti','Oggi · 11:20'],['check','Marco Sereni ha confermato il progetto demo','Ieri · 17:45'],['users','Nuovo contatto: Elena Valli','Ieri · 15:10']].map(([i,t,time])=>'<div class="activity">'+icon(i)+'<div><strong>'+t+'</strong><small>'+time+'</small></div></div>').join('')+'</div>'}
function overview(){const won=sum(leads.filter(x=>x.stage==='acquisito')),target=15000;return heading('Le prossime storie<br>iniziano da te.','Clienti, progetti e prossimi passi. Tutto nel tuo spazio.',quoteButton())+metrics()+'<div class="dashboard-grid"><section class="panel"><div class="panel-head"><div><h2>I progetti da seguire</h2><p class="panel-sub">Una relazione alla volta, un libro alla volta.</p></div><button class="text-button" data-section="clients">Tutti i clienti '+icon('arrow')+'</button></div>'+[leads.find(x=>x.id===2),leads.find(x=>x.id===3),leads.find(x=>x.id===1),leads.find(x=>x.id===4)].filter(Boolean).map(row).join('')+'</section><section class="panel"><div class="panel-head"><div><h2>Il tuo prossimo passo</h2><p class="panel-sub">Le priorità dello scenario di oggi.</p></div>'+icon('calendar')+'</div><div class="priority-card"><div class="priority-top">'+icon('clock')+'OGGI · 15:30</div><strong>Ascolta il progetto di Giulia</strong><p>Una storia di famiglia, appunti e registrazioni. Parti dai suoi materiali.</p><button class="btn" data-action="detail" data-id="1">Apri il brief '+icon('arrow')+'</button></div><div class="priority-card"><div class="priority-top">'+icon('clock')+'OGGI · 16:00</div><strong>Un riscontro da Luca</strong><p>Il preventivo demo è pronto. Chiarisci dubbi, perimetro e prossimi passi.</p><button class="btn" data-action="detail" data-id="2">Prepara il follow-up '+icon('arrow')+'</button></div><div class="goal"><div class="goal-top"><span>Obiettivo del periodo</span><span class="demo-pill">DEMO</span></div><div class="goal-value">'+euro(won)+' <small>/ '+euro(target)+'</small></div><div class="progress"><span style="width:'+Math.min(100,Math.round(won/target*100))+'%"></span></div><p>Uno scenario per mostrare il percorso commerciale.</p></div></section></div><section class="panel activity-panel"><div class="panel-head"><h2>Attività recente</h2><button class="text-button" data-section="activities">Vedi attività '+icon('arrow')+'</button></div>'+activityList()+'</section>'}
function searchInput(){return '<label class="search">'+icon('search')+'<input id="search" aria-label="Cerca un cliente o un progetto" placeholder="Cerca cliente o progetto…" value="'+esc(query)+'"></label>'}
function clientRows(){const q=query.toLocaleLowerCase('it');return leads.filter(l=>(l.name+' '+l.title+' '+l.type).toLocaleLowerCase('it').includes(q)).map(l=>'<tr><td><strong>'+esc(l.name)+'</strong><small>'+esc(l.source)+'</small></td><td>'+esc(l.type)+'<br><small>'+esc(l.title)+'</small></td><td>'+badge(l.stage)+'</td><td>'+euro(l.amount)+'</td><td>'+esc(l.next)+'</td><td><button class="btn secondary small" data-action="detail" data-id="'+l.id+'">Apri scheda</button></td></tr>').join('')||'<tr><td colspan="6" class="empty">Nessun cliente corrisponde alla ricerca.</td></tr>'}
function clients(){return heading('Le tue relazioni,<br>i loro libri.','Il brief, la fase e il prossimo contatto per ogni progetto.','<button class="btn" data-action="new-client">'+icon('plus')+'Nuovo cliente</button>')+'<div class="toolbar">'+searchInput()+'<span class="subtitle">'+leads.length+' clienti nello scenario demo</span></div><section class="panel table-wrap"><table><thead><tr><th>Cliente</th><th>Progetto</th><th>Fase</th><th>Valore demo</th><th>Prossimo contatto</th><th>Dettagli</th></tr></thead><tbody id="client-rows">'+clientRows()+'</tbody></table></section>'}
function pipeline(){return heading('Dall’incontro<br>al progetto confermato.','Apri una scheda e aggiorna la fase per provare il percorso.',quoteButton())+'<div class="pipeline">'+stages.map(([key,name])=>{const items=leads.filter(l=>l.stage===key);return '<section class="pipeline-column"><div class="pipeline-title"><span>'+name+'</span><span>'+items.length+'</span></div><p class="pipeline-total">'+euro(sum(items))+'</p>'+items.map(l=>'<button class="deal" data-action="detail" data-id="'+l.id+'" aria-label="Apri '+esc(l.name)+'">'+badge(l.stage)+'<strong>'+esc(l.name)+'</strong><p>'+esc(l.type)+'</p><div class="deal-bottom"><b>'+euro(l.amount)+'</b><span>'+esc(l.initial)+'</span></div></button>').join('')+'</section>'}).join('')+'</div><p class="subtitle">Le variazioni riguardano soltanto questa demo e si azzerano ricaricando la pagina.</p>'}
function quotes(){const items=leads.filter(l=>['preventivo','trattativa','acquisito'].includes(l.stage));return heading('Proposte chiare.<br>Il prossimo sì.','Valori e stati fittizi per presentare il lavoro del venditore.',quoteButton())+'<div class="commission-note">Gli importi illustrano lo scenario demo: non costituiscono il listino o un preventivo reale di Proemios.</div><section class="panel table-wrap"><table><thead><tr><th>Riferimento demo</th><th>Cliente e progetto</th><th>Importo</th><th>Stato</th><th>Azioni</th></tr></thead><tbody>'+items.map(l=>'<tr><td>P-DEMO-'+String(l.id).padStart(3,'0')+'</td><td><strong>'+esc(l.name)+'</strong><small>'+esc(l.title)+'</small></td><td>'+euro(l.amount)+'</td><td>'+badge(l.stage)+'</td><td><button class="btn secondary small" data-action="detail" data-id="'+l.id+'">Apri proposta</button></td></tr>').join('')+'</tbody></table></section>'}
function commissions(){const won=leads.filter(l=>l.stage==='acquisito'),total=sum(won)*.15;return heading('Il valore<br>del tuo lavoro.','Una vista di esempio su accordi e compensi del partner.')+'<div class="commission-banner"><div><h2>Provvigioni stimate nello scenario</h2><p>Calcolate sui progetti demo confermati.</p></div><strong>'+euro(total)+'</strong></div><div class="commission-note">Aliquota ipotetica del 15%, usata solo per la presentazione. Condizioni, maturazione e liquidazione effettive devono essere concordate.</div><section class="panel table-wrap"><table><thead><tr><th>Progetto</th><th>Valore demo</th><th>Ipotesi di calcolo</th><th>Provvigione stimata</th><th>Stato</th></tr></thead><tbody>'+won.map(l=>'<tr><td><strong>'+esc(l.name)+'</strong><small>'+esc(l.title)+'</small></td><td>'+euro(l.amount)+'</td><td>15% demo</td><td>'+euro(l.amount*.15)+'</td><td><span class="badge qualificato">Simulazione</span></td></tr>').join('')+'</tbody></table></section>'}
function activities(){return heading('Il prossimo contatto<br>fa la differenza.','Prova a completare un’attività o apri la scheda del cliente.')+'<section class="panel"><div class="panel-head"><h2>Call e follow-up</h2><span class="panel-sub">'+(leads.length-completed.size)+' attività da completare</span></div>'+leads.map(l=>'<div class="todo"><button class="todo-check '+(completed.has(l.id)?'done':'')+'" data-action="complete" data-id="'+l.id+'" aria-label="'+(completed.has(l.id)?'Riapri':'Completa')+' attività di '+esc(l.name)+'" aria-pressed="'+completed.has(l.id)+'">'+(completed.has(l.id)?icon('check'):'')+'</button><div class="lead-info"><p class="'+(completed.has(l.id)?'done-text':'')+'"><strong>'+esc(l.task)+'</strong> · '+esc(l.name)+'</p><small>'+esc(l.next)+'</small></div><button class="btn secondary small" data-action="detail" data-id="'+l.id+'">Scheda cliente</button></div>').join('')+'</section>'}
function render(){nav.innerHTML=sections.map(([id,name,i])=>'<button data-section="'+id+'"'+(current===id?' aria-current="page"':'')+'>'+icon(i)+name+(id==='clients'?'<span class="nav-count">'+leads.length+'</span>':'')+'</button>').join('');content.innerHTML=({overview,clients,pipeline,quotes,commissions,activities}[current])();}
function closeDialog(){dialog.close();if(opener?.isConnected)opener.focus();}
function openDialog(html){opener=document.activeElement;dialog.innerHTML='<div class="dialog-inner">'+html+'</div>';dialog.showModal();}
function dialogHeader(title,eyebrow='CLIENTE · DATI DI ESEMPIO'){return '<div class="dialog-head"><div><p class="eyebrow">'+eyebrow+'</p><h2 id="dialog-title">'+title+'</h2></div><button class="close" data-action="close" aria-label="Chiudi scheda">'+icon('close')+'</button></div>'}
function detail(id){const l=leads.find(x=>x.id===id);if(!l)return;openDialog(dialogHeader(esc(l.name))+'<p class="subtitle">'+esc(l.title)+' · '+esc(l.type)+'</p><div class="detail-grid"><div class="detail-box"><small>VALORE DEL PROGETTO DEMO</small><strong>'+euro(l.amount)+'</strong></div><div class="detail-box"><small>PROSSIMO CONTATTO</small><strong>'+esc(l.next)+'</strong></div></div><p class="brief">'+esc(l.brief)+'</p><form id="stage-form" data-id="'+id+'"><label class="field">Fase commerciale<select name="stage">'+stages.map(([key,name])=>'<option value="'+key+'"'+(l.stage===key?' selected':'')+'>'+name+'</option>').join('')+'</select></label><button class="btn secondary small" type="submit">Aggiorna fase demo</button></form><h3 style="font-size:22px;margin:22px 0 10px">Il brief e le tue note</h3>'+l.notes.map(n=>'<p class="timeline-note">'+esc(n)+'</p>').join('')+'<form id="note-form" data-id="'+id+'" style="margin-top:17px"><label class="field">Aggiungi una nota di esempio<textarea name="note" maxlength="1000" required placeholder="Es. Chiarire i materiali disponibili prima della proposta."></textarea></label><button class="btn secondary small" type="submit">Salva nota demo</button></form><p class="form-note" style="margin-top:15px">Solo dati di esempio. Le note restano in memoria fino al ricaricamento.</p>')}
function newQuote(){openDialog(dialogHeader('Un percorso da proporre.','NUOVO PREVENTIVO DEMO')+'<p class="form-note">Importi dimostrativi, non listino Proemios. Nessuna email viene inviata.</p><form id="quote-form"><label class="field">Cliente<select name="client">'+leads.map(l=>'<option value="'+l.id+'">'+esc(l.name)+' · '+esc(l.type)+'</option>').join('')+'</select></label><label class="field">Importo dello scenario (€)<input name="amount" type="number" min="1" max="100000" step="1" value="4600" required></label><label class="field">Percorso proposto<textarea name="scope" maxlength="1000" required>Definizione del brief, lavoro editoriale e preparazione dei file finali. Perimetro da concordare con il team.</textarea></label><div class="dialog-actions"><button type="button" class="btn secondary" data-action="close">Annulla</button><button class="btn" type="submit">Salva e simula invio '+icon('arrow')+'</button></div></form>')}
function newClient(){openDialog(dialogHeader('Una nuova storia.','NUOVO CLIENTE DEMO')+'<p class="form-note">Usa soltanto dati fittizi per questa presentazione.</p><form id="client-form"><label class="field">Nome di esempio<input name="name" maxlength="70" required placeholder="Es. Silvia Bianchi"></label><label class="field">Titolo del progetto<input name="title" maxlength="100" required placeholder="Es. Il libro del mio metodo"></label><div class="field-pair"><label class="field">Tipo di libro<select name="type"><option>Romanzo</option><option>Memoir</option><option>Libro professionale</option><option>Storia d’impresa</option><option>Storia vera</option></select></label><label class="field">Valore demo (€)<input name="amount" type="number" min="1" max="100000" step="1" value="3500" required></label></div><div class="dialog-actions"><button type="button" class="btn secondary" data-action="close">Annulla</button><button type="submit" class="btn">Aggiungi alla demo</button></div></form>')}
document.addEventListener('click',e=>{const button=e.target.closest('button');if(!button)return;const section=button.dataset.section;if(section){current=section;query='';render();document.getElementById('shell').classList.remove('menu-open');document.getElementById('menu').setAttribute('aria-expanded','false');return;}const id=Number(button.dataset.id);switch(button.dataset.action){case'detail':detail(id);break;case'close':closeDialog();break;case'new-quote':newQuote();break;case'new-client':newClient();break;case'complete':completed.has(id)?completed.delete(id):completed.add(id);render();notify('Attività aggiornata nella demo.');break;}});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;document.getElementById('client-rows').innerHTML=clientRows();}});
document.addEventListener('submit',e=>{e.preventDefault();const form=e.target,data=new FormData(form),id=Number(form.dataset.id),l=leads.find(x=>x.id===id);if(form.id==='stage-form'&&l){l.stage=String(data.get('stage'));l.notes.push('Fase demo aggiornata: '+label(l.stage)+'.');closeDialog();render();notify('Fase aggiornata: '+label(l.stage)+'.');}else if(form.id==='note-form'&&l){const note=String(data.get('note')||'').trim();if(!note)return;l.notes.push(note);dialog.close();detail(id);notify('Nota salvata nella demo.');}else if(form.id==='quote-form'){const client=leads.find(x=>x.id===Number(data.get('client'))),amount=Number(data.get('amount'));if(!client||!Number.isFinite(amount)||amount<=0||amount>100000)return;client.amount=amount;client.stage='preventivo';client.notes.push('Proposta demo: '+String(data.get('scope')).trim());closeDialog();current='quotes';render();notify('Preventivo demo salvato. Nessuna email inviata.');}else if(form.id==='client-form'){const name=String(data.get('name')).trim(),title=String(data.get('title')).trim(),amount=Number(data.get('amount'));if(!name||!title||!Number.isFinite(amount)||amount<=0||amount>100000)return;leads.push({id:Math.max(...leads.map(l=>l.id))+1,name,title,type:String(data.get('type')),amount,stage:'nuovo',source:'Inserimento demo',initial:initials(name),color:'lilac',next:'Da pianificare',task:'Prima chiamata',brief:'Nuovo progetto di esempio, da approfondire.',notes:['Cliente fittizio aggiunto durante la presentazione.']});closeDialog();current='clients';query='';render();notify('Cliente di esempio aggiunto alla demo.');}});
document.getElementById('reset').addEventListener('click',()=>{leads=structuredClone(seed);completed=new Set();query='';current='overview';render();notify('Scenario iniziale ripristinato.');});
const menu=document.getElementById('menu');menu.innerHTML=icon('menu');menu.addEventListener('click',()=>{const open=document.getElementById('shell').classList.toggle('menu-open');menu.setAttribute('aria-expanded',String(open));menu.setAttribute('aria-label',open?'Chiudi navigazione':'Apri navigazione');});document.getElementById('shade').addEventListener('click',()=>{document.getElementById('shell').classList.remove('menu-open');menu.setAttribute('aria-expanded','false');menu.setAttribute('aria-label','Apri navigazione');menu.focus();});document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.getElementById('shell').classList.remove('menu-open');menu.setAttribute('aria-expanded','false');menu.setAttribute('aria-label','Apri navigazione');}});
document.getElementById('demo-notice').innerHTML=icon('shield')+'Demo per la presentazione · dati di esempio · nessun invio o pagamento reale';
render();
</script>
</body>
</html>
