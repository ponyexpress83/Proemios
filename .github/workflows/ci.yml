name: CI

on:
  pull_request:
  push:
    branches:
      - claude/kalamos-studio-phase-1-6z6xyw
      - ads-ready-sep-2026

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npx eslint .
      - run: npm run build
        env:
          DEMO_MODE: on
